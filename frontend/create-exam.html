<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam | ProctorConsole</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    ProctorConsole
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    Dashboard
                </a>
                <a href="create-exam.html" class="nav-item active">
                    Create Exam
                </a>
                <a href="candidates.html" class="nav-item">
                    Candidates
                </a>
                <a href="reports.html" class="nav-item">
                    Reports
                </a>
                <a href="admin-messages.html" class="nav-item">
                    Messages
                </a>
                <a href="settings.html" class="nav-item">
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-width center-block">
                <div class="dashboard-header">
                    <div>
                        <h1>Create New Exam</h1>
                    </div>
                </div>

            <div class="dashboard-content">
                <div class="card">
                    <form id="createExamForm">
                        <div class="mb-3">
                            <label class="block mb-1 bold">Exam Title</label>
                            <input type="text" id="examTitle" class="form-input" required placeholder="e.g. Midterm Examination">
                        </div>
                        <div class="mb-3">
                            <label class="block mb-1 bold">Description</label>
                            <textarea id="examDesc" class="form-input" required rows="3" placeholder="Description..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="block mb-1 bold">Duration (Minutes)</label>
                            <input type="number" id="examDuration" class="form-input" required value="60">
                        </div>
                        <div class="flex gap-2 mb-3">
                            <div class="grow">
                                <label class="block mb-1 bold">Scheduled Start Time (Optional)</label>
                                <input type="datetime-local" id="examStartTime" class="form-input">
                            </div>
                            <div class="grow">
                                <label class="block mb-1 bold">Scheduled End Time (Optional)</label>
                                <input type="datetime-local" id="examEndTime" class="form-input">
                            </div>
                        </div>

                        <h3 class="mt-3 mb-2 line-below">Assign Students</h3>
                        <p class="muted small mb-2">Select the students who will be allowed to take this exam.</p>
                        <div class="max-h-300 scroll-y bordered padded mb-3" id="studentListContainer">
                            <div class="text-center muted">Loading students...</div>
                        </div>

                        <div class="flex space-between align-center mt-3 mb-2 line-below">
                            <h3 class="m-0">Questions</h3>
                            <h3 class="m-0 text-blue">Total Marks: <span id="totalMarksDisplay">0</span></h3>
                        </div>
                        <div id="questionsList">
                            <!-- Questions will be added here -->
                        </div>

                        <button type="button" id="addQuestionBtn" class="btn-secondary mb-3">+ Add Question</button>

                        <div class="text-right line-above">
                            <button type="submit" class="btn-primary" id="saveExamBtn">Save Exam</button>
                        </div>
                    </form>
                </div>
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/create-exam.js"></script>
</body>
</html>
