<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboard Tenant | ProctorConsole</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    ProctorConsole
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="super-admin.html" class="nav-item">
                    Dashboard
                </a>
                <a href="organizations.html" class="nav-item">
                    Organizations
                </a>
                <a href="onboard-tenant.html" class="nav-item active">
                    Onboard Tenant
                </a>
                <a href="super-admin-settings.html" class="nav-item">
                    Settings
                </a>
                <a href="super-admin-messages.html" class="nav-item">
                    Messages
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-width center-block">
                <div class="dashboard-header">
                    <div>
                        <h1>Onboard New Tenant</h1>
                    </div>
                </div>

            <div class="dashboard-content block">
                <div class="card">
                    <form id="onboardForm">
                        <div class="mb-3">
                            <label class="block mb-1 bold">Organization Name</label>
                            <input type="text" id="orgName" class="form-input" required placeholder="e.g. Stanford University">
                        </div>
                        <div class="mb-3">
                            <label class="block mb-1 bold">Tenant Slug</label>
                            <input type="text" id="orgSlug" class="form-input" required placeholder="e.g. stanford">
                            <small class="muted">Used for tenant identification.</small>
                        </div>
                        <h3 class="mt-3 mb-2 line-below">Initial Admin Account</h3>
                        <div class="mb-3">
                            <label class="block mb-1 bold">Admin Email</label>
                            <input type="email" id="adminEmail" class="form-input" required placeholder="admin@stanford.edu">
                        </div>
                        <div class="mb-3">
                            <label class="block mb-1 bold">Admin Password</label>
                            <input type="password" id="adminPassword" class="form-input" required>
                        </div>
                        <button type="submit" class="btn-primary full-width" id="createBtn">Create Organization & Admin</button>
                    </form>
                </div>
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/onboard-tenant.js"></script>
</body>
</html>
