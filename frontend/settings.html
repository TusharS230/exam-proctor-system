            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn" style="cursor: pointer;">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div style="font-weight: 600; color: var(--text-primary);" id="sidebarName">User</div>
                        <div style="font-size: 0.75rem;" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div style="max-width: 1000px; margin: 0 auto;">
                <div style="margin-bottom: 2rem;">
                    <h1>Account Settings</h1>
                    <p style="color: var(--text-secondary);">Manage your account preferences and security.</p>
                </div>

                <div class="card">
                <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Change Password</h2>
                
                <form id="changePasswordForm">
                    <div style="margin-bottom: 1.5rem;">
                        <label for="currentPassword" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Current Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="currentPassword" class="form-control" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('currentPassword', this)">Show</button>
                        </div>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label for="newPassword" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="newPassword" class="form-control" required minlength="6">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword', this)">Show</button>
                        </div>
                    </div>

                    <div style="margin-bottom: 2rem;">
                        <label for="confirmPassword" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Confirm New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPassword', this)">Show</button>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end;">
                        <button type="submit" class="btn-primary" id="savePasswordBtn">Update Password</button>
                    </div>
                </form>
            </div>
            
            <div style="margin-top: 2rem;">
                <button id="logoutBtn" class="btn-primary" style="background-color: var(--danger); border-color: var(--danger);">Logout</button>
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/settings.js"></script>
    <script>
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('jwt_token');
            sessionStorage.removeItem('tenant_id');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
