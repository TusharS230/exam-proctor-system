        .exam-info p { color: var(--text-secondary); margin: 0; font-size: 0.9rem; }

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/student-sidebar.js"></script>
    <script src="js/student-active-exams.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tenant = sessionStorage.getItem('tenant_id') || 'tenant';
            const sidebarTenant = document.getElementById('studentTenantSidebar');
            if (sidebarTenant) sidebarTenant.textContent = tenant;
        });
    </script>
