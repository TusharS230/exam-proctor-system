<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Exam System</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    Student Portal
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html" class="nav-item active">
                    Dashboard
                </a>
                <a href="student-active-exams.html" class="nav-item">
                    Available Exams <span class="notify-dot" id="activeExamsDot"></span>
                </a>
                <a href="student-past-exams.html" class="nav-item">
                    Past Exams
                </a>
                <a href="student-messages.html" class="nav-item">
                    Messages
                </a>
                <a href="student-settings.html" class="nav-item">
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="mb-1">Dashboard Overview</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3 class="muted small m-0 mb-1">Exams Attempted</h3>
                    <div class="xlarge bold" id="totalExams">0</div>
                </div>
                <div class="stat-card">
                    <h3 class="muted small m-0 mb-1">Average Score</h3>
                    <div class="xlarge bold text-blue" id="avgScore">0%</div>
                </div>
                <div class="stat-card">
                    <h3 class="muted small m-0 mb-1">Highest Score</h3>
                    <div class="xlarge bold text-blue" id="highScore">0%</div>
                </div>
            </div>

            <div class="card">
                <h2 class="large mb-3 line-below">Marks Over Time</h2>
                <div class="chart-box full-width">
                    <canvas id="marksChart"></canvas>
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/student-sidebar.js"></script>
    <script src="js/student-dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tenant = sessionStorage.getItem('tenant_id') || 'tenant';
            const sidebarTenant = document.getElementById('studentTenantSidebar');
            if (sidebarTenant) sidebarTenant.textContent = tenant;
        });
    </script>
</body>
</html>
