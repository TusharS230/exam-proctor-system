<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | Exam System</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    Student Portal
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html" class="nav-item">
                    Dashboard
                </a>
                <a href="student-active-exams.html" class="nav-item">
                    Available Exams <span class="notify-dot" id="activeExamsDot"></span>
                </a>
                <a href="student-past-exams.html" class="nav-item">
                    Past Exams
                </a>
                <a href="student-messages.html" class="nav-item">
                    Messages
                </a>
                <a href="student-settings.html" class="nav-item active">
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-width center-block">
                <div class="mb-3">
                    <h1>Account Settings</h1>
                </div>

                <div class="card">
                <h2 class="large mb-3">Change Password</h2>

                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label class="block mb-1" for="currentPassword">Current Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="currentPassword" class="form-control" required placeholder="Enter current password" autocomplete="current-password">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('currentPassword', this)">Show</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="block mb-1" for="newPassword">New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="newPassword" class="form-control" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword', this)">Show</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="block mb-1" for="confirmPassword">Confirm New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" class="form-control" required minlength="6" placeholder="Re-enter new password" autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPassword', this)">Show</button>
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button type="submit" class="btn-primary" id="savePasswordBtn">Update Password</button>
                    </div>
                </form>
            </div>

            <div class="mt-3">
                <button id="logoutBtn" class="btn-danger">Logout</button>
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/student-sidebar.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
