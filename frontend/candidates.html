<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidates Roster | ProctorConsole</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    ProctorConsole
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    Dashboard
                </a>
                <a href="create-exam.html" class="nav-item">
                    Create Exam
                </a>
                <a href="candidates.html" class="nav-item active">
                    Candidates
                </a>
                <a href="reports.html" class="nav-item">
                    Reports
                </a>
                <a href="admin-messages.html" class="nav-item">
                    Messages
                </a>
                <a href="settings.html" class="nav-item">
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Candidates Roster</h1>
                </div>
            </div>

            <div class="dashboard-content flex flex-column gap-2">
                <div class="card">
                    <h2 class="mb-2 line-below">Onboard Students</h2>

                    <div class="flex gap-2">
                        <!-- Manual Entry Form -->
                        <div class="grow">
                            <h3 class="mb-2">Manual Entry</h3>
                            <form id="manualEntryForm">
                                <div class="mb-2">
                                    <label class="block mb-1">Email Address</label>
                                    <input type="email" id="manualEmail" class="form-input" required placeholder="Enter student email" autocomplete="off">
                                </div>
                                <div class="mb-2">
                                    <label class="block mb-1">Password</label>
                                    <input type="password" id="manualPassword" class="form-input" required placeholder="At least 6 characters" autocomplete="new-password" minlength="6">
                                </div>
                                <button type="submit" class="btn-primary full-width" id="manualBtn">Add Student</button>
                            </form>
                        </div>

                        <!-- Divider -->
                        <div class="divider-v"></div>

                        <!-- Bulk Import Form -->
                        <div class="grow">
                            <h3 class="mb-2">Bulk Import (CSV)</h3>
                            <p class="small muted mb-2">Upload a CSV file containing headers: <code>email,password</code></p>
                            <form id="bulkImportForm">
                                <div class="mb-2">
                                    <input type="file" id="csvFile" accept=".csv" class="form-input" required>
                                </div>
                                <button type="submit" class="btn-primary full-width" id="bulkBtn">Import Students</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Student Email</th>
                                <th>Joined Date</th>
                                <th>Status</th>
                                <th>Exams Completed</th>
                                <th>Average Score</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="candidatesTableBody">
                            <tr><td class="text-center" colspan="4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/candidates.js"></script>
</body>
</html>
