<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Exam System</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">

</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    ProctorConsole
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="super-admin.html" class="nav-item">
                    Dashboard
                </a>
                <a href="organizations.html" class="nav-item">
                    Organizations
                </a>
                <a href="onboard-tenant.html" class="nav-item">
                    Onboard Tenant
                </a>
                <a href="super-admin-settings.html" class="nav-item">
                    Settings
                </a>
                <a href="super-admin-messages.html" class="nav-item active">
                    Messages
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <h1>Messages</h1>
                <button class="btn-primary" id="composeBtn">Compose Message</button>
            </div>

            <div class="content-section p-0">
                <div id="inboxView">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>From/To</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="inboxTableBody">
                            <tr><td class="text-center" colspan="4">Loading messages...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="padded" id="threadView" style="display: none;">
                    <div class="flex space-between align-center mb-2">
                        <h2 class="m-0" id="threadSubject">Thread Subject</h2>
                        <button class="btn-secondary" id="backToInboxBtn">&larr; Back to Inbox</button>
                    </div>
                    <div class="flex flex-column gap-2 mb-3 max-h-500 scroll-y" id="threadMessages">
                        <!-- Messages go here -->
                    </div>
                    <div class="reply-box line-above">
                        <textarea class="full-width bordered bg-grey mb-1" id="replyContent" rows="3" placeholder="Type your reply here..."></textarea>
                        <button class="btn-primary" id="sendReplyBtn">Send Reply</button>
                    </div>
                </div>
            </div>

            <!-- Compose Modal -->
            <div id="composeModal" class="modal">
                <div class="modal-content narrow">
                    <h2 class="mt-0">Compose Message</h2>
                    <form id="composeForm">
                        <div class="form-group">
                            <label>To Organization</label>
                            <select class="full-width bordered bg-grey" id="composeToOrg" required>
                                <option value="" disabled selected>Loading organizations...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Subject</label>
                            <input type="text" id="composeSubject" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea class="full-width bordered" id="composeContent" rows="5" required></textarea>
                        </div>
                        <div class="flex gap-2 justify-end mt-3">
                            <button type="button" class="btn-secondary" id="cancelComposeBtn">Cancel</button>
                            <button type="submit" class="btn-primary">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
