<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Exams | Exam System</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    Student Portal
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html" class="nav-item">
                    Dashboard
                </a>
                <a href="student-active-exams.html" class="nav-item">
                    Available Exams <span class="notify-dot" id="activeExamsDot"></span>
                </a>
                <a href="student-past-exams.html" class="nav-item active">
                    Past Exams
                </a>
                <a href="student-messages.html" class="nav-item">
                    Messages
                </a>
                <a href="student-settings.html" class="nav-item">
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">


            <h1 class="mb-1">Past Exams (History)</h1>

            <div class="filter-bar">
                <div class="flex gap-2 align-center grow">
                    <div>
                        <label class="small muted block mb-1">Start Date</label>
                        <input type="date" id="filterStartDate" class="form-input">
                    </div>
                    <div>
                        <label class="small muted block mb-1">End Date</label>
                        <input type="date" id="filterEndDate" class="form-input">
                    </div>
                </div>
                <div>
                    <label class="small muted block mb-1">Sort Order</label>
                    <select id="sortOrder" class="form-input min-w-150">
                        <option value="desc">Newest First</option>
                        <option value="asc">Oldest First</option>
                    </select>
                </div>
            </div>

            <div id="historyList">
                <div class="text-center muted padded">Loading history...</div>
            </div>
        </main>
    </div>

    <!-- View Submission Modal -->
    <div class="overlay" id="viewModal" style="display: none;">
        <div class="padded narrow max-h-90vh scroll-y">
            <h2 class="mb-2">Exam Submission</h2>
            <div class="mb-3" id="viewQuestionsContainer">
                <!-- Answers will be injected here -->
            </div>
            <div class="flex justify-end">
                <button id="closeViewModal" class="btn-secondary">Close</button>
            </div>
        </div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
<script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/student-sidebar.js"></script>
    <script src="js/student-past-exams.js"></script>
</body>
</html>
