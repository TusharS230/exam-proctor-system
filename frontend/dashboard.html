<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctor Dashboard | Exam System</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/helpers.css">
    <!-- WebSocket Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    ProctorConsole
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    Dashboard
                </a>
                <a href="create-exam.html" class="nav-item">
                    Create Exam
                </a>
                <a href="candidates.html" class="nav-item">
                    Candidates
                </a>
                <a href="reports.html" class="nav-item">
                    Reports
                </a>
                <a href="admin-messages.html" class="nav-item">
                    Messages
                </a>
                <a href="settings.html" class="nav-item">
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div class="bold" id="sidebarName">User</div>
                        <div class="small" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Live Monitoring</h1>
                </div>
                <div>
                    <span id="connectionStatus" class="status-badge status-offline">Offline</span>
                </div>
            </div>


            <div class="dashboard-content">
                <!-- TOP LEFT: Quick Analytics Column -->
                <div class="dashboard-panel">
                    <div class="flex space-between align-center mb-2">
                        <h2 class="section-title mb-0">Quick Analytics</h2>
                        <select id="analyticsTimeframe" class="form-control w-auto small">
                            <option value="today">Today</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                            <option value="year">This Year</option>
                        </select>
                    </div>
                    <div class="connection-panel" id="quickAnalyticsList">
                        <div class="text-center muted padded">
                            Loading analytics...
                        </div>
                    </div>
                </div>

                <!-- TOP RIGHT: Live Alerts Column -->
                <div class="dashboard-panel alerts-panel">
                    <div class="flex space-between align-center mb-2">
                        <h2 class="section-title mb-0">Live Alert Feed</h2>
                        <button id="clearAlertsBtn" class="btn-secondary small">Clear Feed</button>
                    </div>
                    <div class="live-feed max-h-300 scroll-y" id="alertsFeed">
                        <div class="muted text-center padded">
                            Waiting for connection...
                        </div>
                    </div>
                </div>

                <!-- BOTTOM LEFT: Exams Column -->
                <div class="dashboard-panel">
                    <div class="flex space-between align-center mb-2">
                        <h2 class="section-title mb-0">Exams</h2>
                        <select id="examsStatusFilter" class="form-control w-auto small">
                            <option value="ACTIVE">Active</option>
                            <option value="SCHEDULED">Future (Scheduled)</option>
                            <option value="PAST">Past (Closed)</option>
                            <option value="ALL">All Exams</option>
                        </select>
                    </div>
                    <div class="connection-panel max-h-300 scroll-y" id="activeExamsList">
                        <div class="text-center muted padded">
                            Loading exams...
                        </div>
                    </div>
                </div>

                <!-- BOTTOM RIGHT: Active Candidates Column -->
                <div class="dashboard-panel">
                    <h2 class="section-title">Active Candidates</h2>
                    <div class="connection-panel max-h-300 scroll-y" id="activeCandidatesList">
                        <div class="text-center muted padded">
                            Loading active candidates...
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
