<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Exam System</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/toast.css">
    <style>
        .score-high { color: var(--success); font-weight: 600; }
        .score-med { color: #d97706; font-weight: 600; }
        .score-low { color: var(--danger); font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
                    ProctorConsole
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    Dashboard
                </a>
                <a href="create-exam.html" class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    Create Exam
                </a>
                <a href="candidates.html" class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    Candidates
                </a>
                <a href="reports.html" class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    Reports
                </a>
                                <a href="admin-messages.html" class="nav-item active">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    Messages
                </a>
                <a href="settings.html" class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn" style="cursor: pointer;">
                    <div class="avatar" id="sidebarAvatar">U</div>
                    <div>
                        <div style="font-weight: 600; color: var(--text-primary);" id="sidebarName">User</div>
                        <div style="font-size: 0.75rem;" id="sidebarTenant">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <h1>Messages</h1>
                <button class="btn-primary" id="composeBtn" style="padding: 0.6rem 1.2rem; cursor: pointer;">Compose Message</button>
            </div>

            <div class="content-section" style="padding: 0;">
                <div id="inboxView">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>From/To</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="inboxTableBody">
                            <tr><td colspan="4" style="text-align:center;">Loading messages...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="threadView" style="display: none; padding: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h2 id="threadSubject" style="margin:0;">Thread Subject</h2>
                        <button class="btn-primary" id="backToInboxBtn" style="background:var(--secondary-color);">&larr; Back to Inbox</button>
                    </div>
                    <div id="threadMessages" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; max-height: 500px; overflow-y: auto; padding-right: 10px;">
                        <!-- Messages go here -->
                    </div>
                    <div class="reply-box" style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
                        <textarea id="replyContent" rows="3" placeholder="Type your reply here..." style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-primary); margin-bottom: 0.5rem;"></textarea>
                        <button class="btn-primary" id="sendReplyBtn">Send Reply</button>
                    </div>
                </div>
            </div>

            <!-- Compose Modal -->
            <div id="composeModal" class="modal">
                <div class="modal-content" style="max-width: 500px;">
                    <h2 style="margin-top:0;">Compose Message</h2>
                    <form id="composeForm">
                        <div class="form-group">
                            <label>To</label>
                            <input type="text" id="composeTo" disabled style="background:var(--bg-color); color:var(--text-secondary); cursor:not-allowed;">
                        </div>
                        <div class="form-group">
                            <label>Subject</label>
                            <input type="text" id="composeSubject" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea id="composeContent" rows="5" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--surface-color); color: var(--text-primary);"></textarea>
                        </div>
                        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                            <button type="button" class="btn-primary" id="cancelComposeBtn" style="background:var(--danger);">Cancel</button>
                            <button type="submit" class="btn-primary">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <!-- Grading Modal -->
        <div id="gradingModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: var(--surface-color); padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto;">
                <h2 style="margin-bottom: 1rem;">Manual Grading</h2>
                <div id="gradingQuestionsContainer" style="margin-bottom: 2rem;">
                    <!-- Grading inputs will be injected here -->
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button id="closeGradingModal" class="btn-primary" style="background: var(--text-secondary);">Cancel</button>
                    <button id="submitGradesBtn" class="btn-primary">Finalize Grades</button>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
