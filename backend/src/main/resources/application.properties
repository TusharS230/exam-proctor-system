spring.application.name=exam-proctor-backend

# -------------------------------------------------------------------
# Database
# Values come from environment variables; the part after ":" is the
# default used when running locally.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proctor_saas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgre}

# Hibernate creates and updates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries to the console (set SHOW_SQL=true while debugging)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# JWT
# The default secret is only for local development.
# Always set JWT_SECRET (a base64 key of at least 256 bits) in production.
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}

# -------------------------------------------------------------------
# CORS
# Comma separated list of frontend URLs allowed to call the API,
# e.g. https://exxamproctor.netlify.app,http://localhost:3000
# -------------------------------------------------------------------
cors.allowed-origins=${FRONTEND_URL:*}
