spring.application.name=backend

# ===================================================================
# 1. DATABASE NETWORK CONNECTION
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proctor_saas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgre}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 2. OBJECT RELATIONAL MAPPING (JPA / HIBERNATE) CONFIGURATION
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# 3. CONSOLE DEBBUGGING LOGS
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
# This is a 256-bit Hex key used to digitally sign our tokens
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# CORS Configuration for Deployment
cors.allowed-origins=${FRONTEND_URL:*}